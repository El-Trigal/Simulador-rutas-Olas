<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5b45" />
    <title>Transmisor GPS - Garrucha</title>
    <link rel="stylesheet" href="./tracker.css" />
  </head>
  <body>
    <main class="tracker-shell">
      <header>
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Transmisor GPS</h1>
          <p id="secureStatus">Comprobando conexion...</p>
        </div>
      </header>

      <section class="tracker-controls">
        <label>
          <span>Garrucha</span>
          <select id="trackerGarrucha"></select>
        </label>
        <label>
          <span>Ruta programada</span>
          <select id="trackerSchedule"></select>
        </label>
        <button id="toggleTracking" type="button">Iniciar seguimiento</button>
      </section>

      <section class="live-status" aria-live="polite">
        <div class="status-heading">
          <span id="trackingDot" class="tracking-dot"></span>
          <strong id="trackingStatus">Detenido</strong>
        </div>
        <dl>
          <div><dt>Precision GPS</dt><dd id="gpsAccuracy">-</dd></div>
          <div><dt>Distancia a ruta</dt><dd id="routeOffset">-</dd></div>
          <div><dt>Avance</dt><dd id="routeProgress">-</dd></div>
          <div><dt>Ultimo envio</dt><dd id="lastSent">-</dd></div>
        </dl>
      </section>

      <p id="trackerMessage" class="tracker-message">Selecciona la garrucha y la ruta asignada.</p>
      <p class="screen-note">Mantener Safari abierto y la pantalla activa durante la prueba.</p>
    </main>
    <script src="./tracker.js" type="module"></script>
  </body>
</html>
